# Kanagawa Wave — foot terminal
# Elegant, soft, melancholic — perfect for Violet Evergarden aesthetic
# https://github.com/rebelot/kanagawa.nvim

[main]
font=JetBrainsMono NF SemiBold:size=10
pad=15x15
initial-color-theme=dark

[colors-dark]
# Wave palette: warm background, soft foreground
foreground = dcd7ba
background = 1f1f28
alpha = 1

selection-foreground = dcd7ba
selection-background = 3d59a1

# Regular ANSI colors (soft tones)
regular0 = 090618
regular1 = c4746e
regular2 = 54b89a
regular3 = c0a86e
regular4 = 7aa89f
regular5 = a292a3
regular6 = 8ea4a2
regular7 = c8c093

# Bright ANSI colors (muted pastels)
bright0  = 727169
bright1  = e46876
bright2  = 76946a
bright3  = c4b28a
bright4  = 7fb4ca
bright5  = 938aa9
bright6  = 7aa89f
bright7  = dcd7ba

# Extended palette
16       = ffa066
17       = ff9370

[mouse]
hide-when-typing=yes
