# =============================================================================
# KEY BINDINGS
# =============================================================================

# --- Media Controls ---
bind=CTRL+SHIFT,j,spawn,playerctl previous
bind=CTRL+SHIFT,k,spawn,playerctl play-pause
bind=CTRL+SHIFT,l,spawn,playerctl next
bind=CTRL+SHIFT,s,spawn,playerctl stop

# --- Volume & Brightness ---
bind=SHIFT,Right,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=SHIFT,Left,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=CTRL+SHIFT,m,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=SHIFT,Up,spawn,brightnessctl set +10%
bind=SHIFT,Down,spawn,brightnessctl set 10%-

# --- Session ---
bind=SUPER,r,reload_config
bind=SUPER,m,quit
bind=SUPER,l,spawn,veila lock
bind=SUPER+SHIFT,e,spawn,wlogout -b 6

# --- Screenshot ---
bind=SUPER,p,spawn,sh -c 'dir="$HOME/Pictures"; mkdir -p "$dir"; f="$dir/Screenshot_$(date +%Y-%m-%d_%H-%M-%S).png"; grim "$f" && notify-send "Screenshot saved" "$f"'
bind=SUPER+SHIFT,s,spawn,~/.config/scripts/screenshot -r

# --- Launch ---
bind=Alt,Menu,spawn,~/.config/rofi/scripts/show-keybinds.sh
bind=SUPER,k,spawn,android-file-transfer
bind=CTRL,Menu,spawn,rofi -modi emoji -show emoji
bind=NONE,Menu,spawn,rofi -show drun
bind=SUPER+SHIFT,c,spawn,featherpad
bind=SUPER,Return,spawn,foot
bind=SUPER+SHIFT,Return,spawn,foot -e yt-x
bind=SUPER,w,spawn,waterfox
bind=SUPER+SHIFT,p,spawn,pavucontrol
bind=SUPER+SHIFT,a,spawn,lollypop
bind=SUPER,h,spawn,thunar
bind=SUPER,d,spawn,legcord
bind=SUPER+SHIFT,w,spawn,waterfox --private-window
bind=SUPER,v,spawn,vscodium
bind=SUPER,c,spawn,foot -e cava
bind=Alt,k,spawn,keepassxc
# --- Windows ---
bind=SUPER,q,killclient,
bind=SUPER,s,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,g,togglegaps,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized,
bind=SUPER,z,toggle_scratchpad,
bind=SUPER,t,toggleglobal,
bind=Alt,b,togglejump
bind=Alt,Tab,overcircle,next
bind=CTRL,Tab,overcircle,previous

# --- Focus ---
bind=SUPER,Tab,focusstack,next
bind=SUPER+CTRL,Left,focusdir,left
bind=SUPER+CTRL,Right,focusdir,right
bind=SUPER+CTRL,Up,focusdir,up
bind=SUPER+CTRL,Down,focusdir,down

# --- Swap ---
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# --- Move (floating) ---
bind=CTRL+SHIFT,Up,movewin,+0,-10
bind=CTRL+SHIFT,Down,movewin,+0,+10
bind=CTRL+SHIFT,Left,movewin,-10,+0
bind=CTRL+SHIFT,Right,movewin,+10,+0

# --- Resize (floating) ---
bind=CTRL,Up,resizewin,+0,-10
bind=CTRL,Down,resizewin,+0,+10
bind=CTRL,Left,resizewin,-10,+0
bind=CTRL,Right,resizewin,+10,+0

# --- Gaps ---
bind=SUPER+SHIFT,X,incgaps,1
bind=SUPER+SHIFT,Z,incgaps,-1

# --- Layout ---
bind=SUPER,n,switch_layout
bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,

# --- Tags: switch ---
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=Alt,Left,viewtoleft_have_client,0
bind=Alt,Right,viewtoright_have_client,0
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# --- Tags: move window to tag ---
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# --- Tags: drag to adjacent monitor ---
bind=CTRL+SUPER+SHIFT,Left,tagtoleft,0
bind=CTRL+SUPER+SHIFT,Right,tagtoright,0

# --- Monitor focus ---
bind=SUPER+Alt,Left,focusmon,left
bind=SUPER+Alt,Right,focusmon,right
bind=SUPER+CTRL+Alt,Left,tagmon,left
bind=SUPER+CTRL+Alt,Right,tagmon,right

# =============================================================================
# MOUSE BINDINGS
# =============================================================================
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# =============================================================================
# AXIS BINDINGS
# =============================================================================
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
