# =============================================================================
# KEYBOARD
# =============================================================================
xkb_rules_layout=us
repeat_rate=25
repeat_delay=600
numlockon=0

# =============================================================================
# TRACKPAD  (requires relogin to apply)
# =============================================================================
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
mouse_left_handed=0
mouse_middle_button_emulation=0
swipe_min_threshold=1

# =============================================================================
# MOUSE  (requires relogin to apply)
# =============================================================================
mouse_natural_scrolling=0

