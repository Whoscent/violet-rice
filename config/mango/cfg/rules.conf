
# =============================================================================
# WINDOW RULES
# =============================================================================
windowrule=focused_opacity:0.85,appid:foot
windowrule=unfocused_opacity:0.75,appid:foot
windowrule=layer-surface,waybar,blur,0
windowrule=layer-surface,waybar,shadow,0
# =============================================================================
# LAYER RULES
# =============================================================================
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
layerrule=animation_type_open:slide,layer_name:logout_dialog
layerrule=animation_type_close:slide,layer_name:logout_dialog

